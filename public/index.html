<html>
<head>
    <link rel="modulepreload" href="main.js">
    <link rel="modulepreload" href="logic.js">
    <link rel="modulepreload" href="cards/base.js">
    <link rel="modulepreload" href="cards/index.js">
    <link rel="modulepreload" href="cards/expansion.js">
    <link rel="modulepreload" href="cards/absurd.js">
    <link rel="modulepreload" href="cards/test.js">
    <script type="text/javascript" src="jquery.js"></script>
    <script type="module">
        import {showLandingPage} from './main.js'
        showLandingPage()
    </script>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <title>Roguelike Deckbuilder</title>
    <style>
        #landingPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            gap: 15px;
        }
        .columnsContainer {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .gameRow {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
        }
        #landingPage .option {
            cursor: pointer;
            font-size: 1.5em;
            padding: 15px 30px;
            min-width: 200px;
        }
        #landingPage .option[disabled] {
            cursor: default;
            opacity: 0.5;
        }
        .scoreDisplay {
            color: #999;
            font-size: 0.9em;
            display: none;
            position: absolute;
            left: calc(100% + 10px);
            white-space: nowrap;
        }
        #gameContainer {
            display: none;
        }
        #cardPickerDialog {
            width: 25em;
        }
        #cardPickerOptions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        #cardPickerOptions .option {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="landingPage">
    <h1>Roguelike Deckbuilder</h1>
    <div class="columnsContainer">
        <div class="column">
            <div class="gameRow">
                <span class="option" id="game0" choosable></span>
                <span class="scoreDisplay" id="score0"></span>
            </div>
            <div class="gameRow">
                <span class="option" id="game1" choosable></span>
                <span class="scoreDisplay" id="score1"></span>
            </div>
            <div class="gameRow">
                <span class="option" id="game2" choosable></span>
                <span class="scoreDisplay" id="score2"></span>
            </div>
        </div>
        <div class="column">
            <div class="gameRow">
                <span class="option" id="addCard0" choosable>Add Card</span>
            </div>
            <div class="gameRow">
                <span class="option" id="addCard1" choosable>Add Card</span>
            </div>
            <div class="gameRow">
                <span class="option" id="addEvent0" choosable>Add Event</span>
            </div>
        </div>
    </div>
</div>

<div id="cardPickerDialog" class="dialogBox">
    <div id="cardPickerTitle">Choose a card:</div>
    <div id="cardPickerOptions"></div>
    <div style="margin-top: 10px;">
        <span class="option" id="cardPickerCancel" choosable>Cancel</span>
    </div>
</div>

<div id="gameContainer">

<div id='tutorialDialog'>
</div>

<div>
    <div id='rightBox'>
        <div id='best'></div>
    </div>
    <div id='undoArea'> </div>
</div>
<div id='kingdomViewSpot'></div>
<div id='macroSpot'></div>
<div> &nbsp; </div>
<div class='header' id='resolvingHeader'> Resolving: </div>
<div id='toparea'>
    <div id='resolving' class='zone'> </div>
    <div id='choicePrompt'></div>
</div>
<div id='options'></div>

<div id='resources'>
    Actions: <span id='actions' class='resource'></span>
    Buys: <span id='buys' class='resource'></span>
    $: <span id='coin' class='resource'></span>
    @: <span id='energy' class='resource'></span>
    vp: <span id='points' class='resource'></span>
</div>
<div> &nbsp; </div>
<div class='header' zone='events'> <span class='zonename'>Events:</span> </div>
<div id='events' class='zone'> </div>


<div> &nbsp; </div>
<div class='header' zone='supply'> <span class='zonename'>Supplies:</span> </div>
<div id='supply' class='zone'> </div>

<div> &nbsp; </div>
<div class='header' zone='hand'> <span class='zonename'>Hand (<span id='handsize'></span> cards):</span> </div>
<div id='hand' class='zone'> </div>

<div> &nbsp; </div>
<div class='header' zone='play'> <span class='zonename'>Play (<span id='playsize'></span> cards):</span>  </div>
<div id='play' class='zone'> </div>


<div> &nbsp; </div>
<div class='header' zone='discard'> <span class='zonename'>Discard (<span id='discardsize'></span> cards):</span>  </div>
<div id='discard' class='zone'> </div>

<div> &nbsp; </div>
<div class='header'>
    History:
    <span class='logTypes'>
        <input type='radio' name='logType' value='energy' checked='checked'>
            @
        <input type='radio' name='logType' value='costs'> costs
        <input type='radio' name='logType' value='acts'> acts
        <input type='radio' name='logType' value='all'> all
    </span>
</div>
<div> &nbsp; </div>
<div id='log'> </div>

</div>

</body>

</html>
